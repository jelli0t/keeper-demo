spring:
  application:
    name: keeper-demo
  profiles:
    active: dev

  # DATASOURCE
  datasource:
    url: jdbc:postgresql://${DB_ENDPOINT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # JPA settings
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  security:
    oauth2:
      authorizationserver:
        client:
          spring:
            registration:
              client-id: 'plane-client-id'
              client-secret: "$2y$10$xAjCtV3oAjwz6wP/jVhXse1X3frp4TLbpSYIUoVArmcNd.gW9A5Ji" # secret1234
              client-authentication-methods:
                - "none"
                - "client_secret_basic"
                - "client_secret_post"
              authorization-grant-types:
                - "authorization_code"
                - "refresh_token"
                - "client_credentials"
              scopes:
                - "openid"
                - "profile"
                - "email"
              redirect-uris:
                - "http://localhost:8080/login/oauth2/code/plane-client-id"