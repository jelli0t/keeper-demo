spring:
  application:
    name: keeper-demo
  profiles:
    active: dev

  # DATASOURCE
  datasource:
    url: jdbc:postgresql://${DB_ENDPOINT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # JPA settings
  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
  # OAuth2: clients and issued authorizations are JDBC-backed — see OAuth2PersistenceConfig and Flyway V2.

  flyway:
    enabled: true
    locations: classpath:db/migration    # points to your existing SQL scripts
    baseline-on-migrate: true            # safe if DB already has tables
    validate-on-migrate: true

springdoc:
  swagger-ui:
    tagsSorter: alpha
    operationsSorter: alpha
    # Optional: enable “Authorize” in Swagger UI against this same AS (register redirect URI e.g. /swagger-ui/oauth2-redirect.html on your client).
    # oauth:
    #   client-id: plane-client-id
    #   client-secret: secret1234
    #   use-pkce-with-authorization-code-grant: true
